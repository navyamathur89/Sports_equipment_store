<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 3 - Navbar & Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Sports Equipment Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Catalogue</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Cricket</a></li>
            <li><a class="dropdown-item" href="#">Football</a></li>
            <li><a class="dropdown-item" href="#">Footwear</a></li>
          </ul>
        </li>
      </ul>
      <form class="d-flex" onsubmit="return false;">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" id="searchBox" class="form-control" placeholder="Search products...">
        </div>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2>Products</h2>
  <div class="row" id="productGrid">
    <div class="col-md-4 col-sm-12 mb-3 product-item">
      <div class="card">
        <img src="cricket-bat.jpg" class="card-img-top" alt="Cricket Bat">
        <div class="card-body"><h5 class="product-name">Cricket Bat</h5><p>Rs. 1500</p></div>
      </div>
    </div>
    <div class="col-md-4 col-sm-12 mb-3 product-item">
      <div class="card">
        <img src="football.jpg" class="card-img-top" alt="Football">
        <div class="card-body"><h5 class="product-name">Football</h5><p>Rs. 900</p></div>
      </div>
    </div>
    <div class="col-md-4 col-sm-12 mb-3 product-item">
      <div class="card">
        <img src="running-shoes.jpg" class="card-img-top" alt="Running Shoes">
        <div class="card-body"><h5 class="product-name">Running Shoes</h5><p>Rs. 2200</p></div>
      </div>
    </div>
  </div>
  <p id="noResults" class="text-muted" style="display: none;">No products match your search.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const searchBox = document.getElementById('searchBox');
  const products = document.querySelectorAll('.product-item');
  const noResults = document.getElementById('noResults');

  searchBox.addEventListener('input', function () {
    const query = searchBox.value.toLowerCase();
    let matchCount = 0;

    products.forEach(function (product) {
      const name = product.querySelector('.product-name').textContent.toLowerCase();
      if (name.includes(query)) {
        product.style.display = '';
        matchCount++;
      } else {
        product.style.display = 'none';
      }
    });

    noResults.style.display = matchCount === 0 ? 'block' : 'none';
  });
</script>

</body>
</html>
