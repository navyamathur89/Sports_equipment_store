<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 - Grid Layout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h2>Responsive Product Grid</h2>
  <div class="row">
    <div class="col-md-4 col-sm-12 mb-3">
      <div class="card">
        <img src="cricket-bat.jpg" class="card-img-top" alt="Cricket Bat">
        <div class="card-body"><h5>Cricket Bat</h5><p>Rs. 1500</p></div>
      </div>
    </div>
    <div class="col-md-4 col-sm-12 mb-3">
      <div class="card">
        <img src="football.jpg" class="card-img-top" alt="Football">
        <div class="card-body"><h5>Football</h5><p>Rs. 900</p></div>
      </div>
    </div>
    <div class="col-md-4 col-sm-12 mb-3">
      <div class="card">
        <img src="running-shoes.jpg" class="card-img-top" alt="Running Shoes">
        <div class="card-body"><h5>Running Shoes</h5><p>Rs. 2200</p></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
