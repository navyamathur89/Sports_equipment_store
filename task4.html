<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 4 - Circle Image</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #eaf4fb;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .profile-card {
        max-width: 380px;
        margin: 60px auto;
        background-color: white;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        padding: 40px 30px;
        text-align: center;
        transition: transform 0.3s ease;
    }
    .profile-card:hover {
        transform: translateY(-6px);
    }
    .avatar {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border: 4px solid #1a5276;
    }
    .role-badge {
        background-color: #1a5276;
        color: white;
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 14px;
        display: inline-block;
        margin-top: 8px;
    }
</style>
</head>
<body>

<div class="profile-card">
  <img src="manager.jpg" alt="Store Manager" class="rounded-circle avatar img-fluid">
  <h3 class="mt-3 mb-1">Ms. Jenny Sheaperd</h3>
  <span class="role-badge">Store Manager</span>
  <p class="mt-3 text-muted">Managing operations and customer experience at Sports Equipment Store since 2020.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
